<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Open WebGame — game keyword to playable search-ready website</title>
  <desc id="desc">Open WebGame project cover showing the workflow from game research through embed verification, game-native design, SEO and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061633"/>
      <stop offset=".55" stop-color="#08245b"/>
      <stop offset="1" stop-color="#101a51"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="96" r="180" fill="#7c3aed" opacity=".08"/>
  <circle cx="160" cy="570" r="210" fill="#06b6d4" opacity=".07"/>

  <!-- Pixel accents -->
  <g opacity=".9">
    <rect x="55" y="78" width="12" height="12" fill="#facc15"/>
    <rect x="67" y="66" width="12" height="12" fill="#facc15"/>
    <rect x="67" y="90" width="12" height="12" fill="#facc15"/>
    <rect x="79" y="78" width="12" height="12" fill="#facc15"/>
    <rect x="1195" y="94" width="10" height="10" fill="#22d3ee"/>
    <rect x="1205" y="84" width="10" height="10" fill="#22d3ee"/>
    <rect x="1205" y="104" width="10" height="10" fill="#22d3ee"/>
    <rect x="1215" y="94" width="10" height="10" fill="#22d3ee"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(72 122) scale(.48)">
    <path d="M154 174c-30 4-48 25-55 54l-24 96c-8 32 27 57 52 36l52-43h154l52 43c25 21 60-4 52-36l-24-96c-7-29-25-50-55-54-31-4-57 14-75 29h-54c-18-15-44-33-75-29Z" fill="#f8fbff" stroke="#6ea8ff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M186 231l-44 34 44 34" fill="none" stroke="#123f8d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M326 231l44 34-44 34" fill="none" stroke="#123f8d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M285 215l-58 101" fill="none" stroke="#123f8d" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Hero copy -->
  <text x="258" y="158" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Open</text>
  <text x="258" y="231" fill="url(#titleGrad)" font-family="Inter,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="-4">WebGame</text>
  <text x="78" y="288" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Turn a game keyword into a</text>
  <text x="417" y="288" fill="#22d3ee" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">playable,</text>
  <text x="78" y="325" fill="#c084fc" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">game-native,</text>
  <text x="245" y="325" fill="#a3e635" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">search-ready</text>
  <text x="415" y="325" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">website.</text>

  <!-- Browser mockup -->
  <g transform="translate(690 82)" filter="url(#shadow)">
    <rect width="500" height="310" rx="24" fill="#0b1228" stroke="#4f7ddc" stroke-width="3"/>
    <rect width="500" height="48" rx="24" fill="#111b38"/>
    <rect y="28" width="500" height="20" fill="#111b38"/>
    <circle cx="26" cy="24" r="6" fill="#fb7185"/><circle cx="46" cy="24" r="6" fill="#fbbf24"/><circle cx="66" cy="24" r="6" fill="#34d399"/>
    <rect x="92" y="14" width="280" height="20" rx="10" fill="#1e2d55"/>
    <text x="109" y="29" fill="#8fa8db" font-family="Inter,Arial,sans-serif" font-size="11">your-game.com</text>
    <rect x="24" y="70" width="452" height="92" rx="18" fill="#172042" stroke="#2a4f9b"/>
    <text x="50" y="104" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">PLAY YOUR GAME</text>
    <text x="50" y="132" fill="#9fb3df" font-family="Inter,Arial,sans-serif" font-size="14">Real HTML5 runtime · lazy loaded · fullscreen ready</text>
    <rect x="366" y="91" width="82" height="42" rx="12" fill="url(#playGrad)"/>
    <polygon points="388,102 388,122 405,112" fill="#06220f"/>
    <text x="412" y="117" fill="#06220f" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800">PLAY</text>
    <rect x="24" y="180" width="140" height="96" rx="16" fill="#101b37" stroke="#284a8c"/>
    <rect x="180" y="180" width="140" height="96" rx="16" fill="#101b37" stroke="#284a8c"/>
    <rect x="336" y="180" width="140" height="96" rx="16" fill="#101b37" stroke="#284a8c"/>
    <text x="46" y="215" fill="#22d3ee" font-family="Inter,Arial,sans-serif" font-size="22">⌕</text><text x="74" y="215" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">How to Play</text>
    <text x="202" y="215" fill="#c084fc" font-family="Inter,Arial,sans-serif" font-size="22">◆</text><text x="230" y="215" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Game-Native</text>
    <text x="358" y="215" fill="#a3e635" font-family="Inter,Arial,sans-serif" font-size="22">✓</text><text x="386" y="215" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">SEO Ready</text>
    <text x="46" y="244" fill="#8097c6" font-family="Inter,Arial,sans-serif" font-size="11">Guides + tips</text>
    <text x="202" y="244" fill="#8097c6" font-family="Inter,Arial,sans-serif" font-size="11">Unique visual DNA</text>
    <text x="358" y="244" fill="#8097c6" font-family="Inter,Arial,sans-serif" font-size="11">On-page gate</text>
  </g>

  <!-- Workflow -->
  <g transform="translate(78 408)">
    <text y="0" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">HOW IT WORKS</text>
    <g transform="translate(0 30)">
      <rect width="250" height="112" rx="18" fill="#0c1b3d" stroke="#1f73c9"/>
      <circle cx="34" cy="34" r="20" fill="#0ea5e9"/><text x="28" y="41" fill="white" font-family="Arial" font-size="18" font-weight="700">1</text>
      <text x="66" y="39" fill="white" font-family="Inter,Arial" font-size="17" font-weight="800">Research</text>
      <text x="24" y="76" fill="#9fb3df" font-family="Inter,Arial" font-size="13">Resolve real game + facts</text>
    </g>
    <g transform="translate(270 30)">
      <rect width="250" height="112" rx="18" fill="#0c1b3d" stroke="#8b5cf6"/>
      <circle cx="34" cy="34" r="20" fill="#8b5cf6"/><text x="28" y="41" fill="white" font-family="Arial" font-size="18" font-weight="700">2</text>
      <text x="66" y="39" fill="white" font-family="Inter,Arial" font-size="17" font-weight="800">Verify Embed</text>
      <text x="24" y="76" fill="#9fb3df" font-family="Inter,Arial" font-size="13">Find + test real runtime</text>
    </g>
    <g transform="translate(540 30)">
      <rect width="250" height="112" rx="18" fill="#0c1b3d" stroke="#ec4899"/>
      <circle cx="34" cy="34" r="20" fill="#ec4899"/><text x="28" y="41" fill="white" font-family="Arial" font-size="18" font-weight="700">3</text>
      <text x="66" y="39" fill="white" font-family="Inter,Arial" font-size="17" font-weight="800">Design + Build</text>
      <text x="24" y="76" fill="#9fb3df" font-family="Inter,Arial" font-size="13">Match the game's style</text>
    </g>
    <g transform="translate(810 30)">
      <rect width="250" height="112" rx="18" fill="#0c1b3d" stroke="#84cc16"/>
      <circle cx="34" cy="34" r="20" fill="#65a30d"/><text x="28" y="41" fill="white" font-family="Arial" font-size="18" font-weight="700">4</text>
      <text x="66" y="39" fill="white" font-family="Inter,Arial" font-size="17" font-weight="800">SEO + QA</text>
      <text x="24" y="76" fill="#9fb3df" font-family="Inter,Arial" font-size="13">Pass every deployment gate</text>
    </g>
  </g>

  <text x="78" y="604" fill="#7f98ca" font-family="Inter,Arial,sans-serif" font-size="15">Open Source · MIT · HTML5 Embed · On-Page SEO · Mobile Ready</text>
  <text x="1055" y="604" fill="#22d3ee" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">open-webgame</text>
</svg>