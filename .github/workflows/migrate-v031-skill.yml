name: Sync v0.3.1 Skill

on:
  push:
    branches:
      - feat/v0.3-phase2-quality
    paths:
      - .github/workflows/migrate-v031-skill.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/v0.3-phase2-quality
          fetch-depth: 0

      - name: Patch SKILL.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          skill = Path('SKILL.md')
          source = skill.read_text()
          heading = '# v0.3.1 Quality and Multilingual Upgrade'
          marker = '# Inputs\n'
          if heading not in source:
              if marker not in source:
                  raise SystemExit('SKILL marker not found')
              insert = Path('docs/skill-v031-insert.md').read_text().rstrip() + '\n\n'
              skill.write_text(source.replace(marker, insert + marker, 1))
          PY

      - name: Commit SKILL.md
        shell: bash
        run: |
          if git diff --quiet -- SKILL.md; then
            echo "SKILL already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md
          git commit -m "docs: document v0.3.1 skill quality gates"
          git push origin HEAD:feat/v0.3-phase2-quality
