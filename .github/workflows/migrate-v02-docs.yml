name: Migrate v0.2 docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v02-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update SKILL and README
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path('SKILL.md')
          s = skill.read_text()

          zero = '''# Zero-Config Mode\n\nZero-Config Mode is the default when the user provides only a game keyword. Do not ask for optional details that can be researched safely.\n\nDefaults:\n\n```text\nLanguage: English\nStack: static HTML\nResearch: automatic\nSite mode: auto → play-first only after runtime verification, otherwise guide\nOn-Page SEO: mandatory\nResponsive QA: mandatory\nOutput: complete website folder\nClarifying questions: avoid unless genuinely blocked\n```\n\nCreate or update `open-webgame.json` before the final build. It is the per-project single source of truth for game identity, canonical URL, search intent, runtime URL, visual direction and readiness state. Use `schema/open-webgame.schema.json` as the contract.\n\nWhen research resolves a field, update the config immediately. Do not let HTML, JSON-LD, sitemap, README or runtime configuration silently disagree with it.\n\nSee [`docs/zero-config.md`](./docs/zero-config.md) and [`docs/project-config.md`](./docs/project-config.md).\n\n'''
          if '# Zero-Config Mode' not in s:
              s = s.replace('# Inputs\n', zero + '# Inputs\n')

          machine = '''# Machine-Enforced Gates\n\nWhen the repository scripts are available, run them. Documentation-only self-review is not enough when a rule can be checked mechanically.\n\n```bash\nnpm run check:config -- --config path/to/open-webgame.json\nnpm run check:seo -- --config path/to/open-webgame.json --html path/to/index.html\nnpm run verify:embed:config -- --config path/to/open-webgame.json\nnpm run verify:embed -- --config path/to/open-webgame.json\nnpm run qa -- --config path/to/open-webgame.json --html path/to/index.html\n```\n\nThe offline embed gate validates configuration and rejects obvious project-page/runtime mistakes. The live embed command checks reachability and framing headers. Neither replaces a real browser boot/input/fullscreen/mobile smoke test.\n\nA command failure means the corresponding hard gate has not passed. Do not set `status.deploymentReady = true` to bypass it.\n\n'''
          if '# Machine-Enforced Gates' not in s:
              s = s.replace('# Final QA Gate\n', machine + '# Final QA Gate\n')

          if '0. Project config (`open-webgame.json`)' not in s:
              s = s.replace('```text\n1. Resolved game identity', '```text\n0. Project config (`open-webgame.json`)\n1. Resolved game identity')
          skill.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace(
              '<a href="./references/on-page-seo.md">SEO Standard</a>',
              '<a href="./references/on-page-seo.md">SEO Standard</a> ·\n  <a href="./docs/zero-config.md">Zero Config</a>'
          )

          v02 = '''## v0.2 — Zero-Config + Machine-Enforced QA\n\nOpen WebGame now has an engineering layer in addition to the agent instructions. A generated project should keep one `open-webgame.json` as its single source of truth, and the repository can fail builds when core config, On-Page SEO or embed rules are broken.\n\nIf you only have a game name, that is enough to start:\n\n```text\nScam Artist\n```\n\nAgent default: research the real game automatically, verify the real browser runtime, choose play-first or guide mode, derive the visual system, generate the site, then run hard QA.\n\nOptional local bootstrap:\n\n```bash\nnpm run init:game -- "Scam Artist"\n```\n\nAutomated gates:\n\n```bash\nnpm run check:config -- --config path/to/open-webgame.json\nnpm run check:seo -- --config path/to/open-webgame.json --html path/to/index.html\nnpm run verify:embed -- --config path/to/open-webgame.json\nnpm run qa -- --config path/to/open-webgame.json --html path/to/index.html\n```\n\nSee [`docs/zero-config.md`](./docs/zero-config.md), [`docs/project-config.md`](./docs/project-config.md) and [`CHANGELOG.md`](./CHANGELOG.md).\n\n'''
          if '## v0.2 — Zero-Config + Machine-Enforced QA' not in r:
              r = r.replace('## Live Case\n', v02 + '## Live Case\n')

          old_structure_start = r.find('## Repository Structure\n')
          design_start = r.find('## Design Principle\n')
          if old_structure_start != -1 and design_start != -1 and old_structure_start < design_start:
              structure = '''## Repository Structure\n\n```text\nopen-webgame/\n├── README.md\n├── SKILL.md\n├── AGENTS.md\n├── DESIGN.md\n├── CONTRIBUTING.md\n├── CHANGELOG.md\n├── package.json\n├── LICENSE\n├── schema/\n│   └── open-webgame.schema.json\n├── starter/\n│   └── open-webgame.example.json\n├── scripts/\n│   ├── init.mjs\n│   ├── check-config.mjs\n│   ├── seo-audit.mjs\n│   ├── verify-embed.mjs\n│   └── qa.mjs\n├── docs/\n│   ├── zero-config.md\n│   └── project-config.md\n├── .github/\n│   ├── ISSUE_TEMPLATE/\n│   └── workflows/\n│       ├── ci.yml\n│       ├── embed-smoke.yml\n│       ├── pages.yml\n│       └── convert-readme-preview.yml\n├── references/\n│   ├── iframe-verification.md\n│   ├── on-page-seo.md\n│   ├── site-blueprint.md\n│   └── qa-checklist.md\n└── examples/\n    ├── goblincremental.md\n    ├── scam-artist.md\n    └── scam-artist-site/\n        ├── open-webgame.json\n        ├── robots.txt\n        ├── sitemap.xml\n        ├── README.md\n        └── index.html\n```\n\n'''
              r = r[:old_structure_start] + structure + r[design_start:]
          readme.write_text(r)
          PY

      - name: Commit documentation migration
        run: |
          if git diff --quiet -- SKILL.md README.md; then
            echo 'Docs already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md README.md
          git commit -m 'docs: document v0.2 zero-config and hard gates'
          git push
