name: Apply v0.3.2 skill hardening

on:
  push:
    branches:
      - fix/skill-favicon-release-qa
    paths:
      - 'scripts/_patch_skill_v032.py'
      - '.github/workflows/_apply-skill-v032.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/skill-favicon-release-qa
          fetch-depth: 0

      - name: Patch SKILL and AGENTS
        run: python3 scripts/_patch_skill_v032.py

      - name: Commit patched source-of-truth docs
        run: |
          rm scripts/_patch_skill_v032.py .github/workflows/_apply-skill-v032.yml
          git config user.name "foxigaoqian"
          git config user.email "taa1@foxmail.com"
          git add SKILL.md AGENTS.md scripts/_patch_skill_v032.py .github/workflows/_apply-skill-v032.yml
          git commit -m "docs: harden skill favicon and release readiness rules"
          git push origin HEAD:fix/skill-favicon-release-qa
