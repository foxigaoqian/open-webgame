name: Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schema/**'
      - 'tests/**'
      - 'examples/scam-artist-site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schema/**'
      - 'tests/**'
      - 'examples/scam-artist-site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run final release QA
        run: npm run qa:release:example

      - name: Upload browser quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-artifacts
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
