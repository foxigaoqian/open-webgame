name: Tighten v0.3 iframe permissions

on:
  push:
    branches: [feat/v0.3-production-engine]
    paths:
      - '.github/workflows/migrate-v03-iframe-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.3-production-engine
          fetch-depth: 0

      - name: Reduce iframe permissions to least privilege
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('examples/scam-artist-site/index.html')
          s = p.read_text()
          old = 'allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; cross-origin-isolated; web-share"'
          new = 'allow="autoplay; fullscreen *; gamepad; cross-origin-isolated"'
          if old not in s and new not in s:
              raise SystemExit('Expected iframe allow attribute not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit migration
        run: |
          if git diff --quiet -- examples/scam-artist-site/index.html; then
            echo 'Permissions already tightened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/scam-artist-site/index.html
          git commit -m 'security: minimize Scam Artist iframe permissions'
          git push origin HEAD:feat/v0.3-production-engine
