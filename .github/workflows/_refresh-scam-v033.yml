name: Refresh Scam Artist v0.3.3 claims

on:
  push:
    branches: [feat/v0.3.3-reliability-hardening]
    paths:
      - 'scripts/_refresh_scam_claims_v033.py'
      - '.github/workflows/_refresh-scam-v033.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/v0.3.3-reliability-hardening
          fetch-depth: 0

      - name: Refresh localized source-backed copy
        run: python3 scripts/_refresh_scam_claims_v033.py

      - name: Commit localized content updates
        shell: bash
        run: |
          git add examples/scam-artist-site/index.html examples/scam-artist-site/ja/index.html examples/scam-artist-site/ko/index.html
          if git diff --cached --quiet; then
            echo 'Content already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align localized demo with verified current claims'
          git push origin HEAD:feat/v0.3.3-reliability-hardening
