name: Capture real README preview

on:
  push:
    branches: [main]
    paths:
      - 'examples/scam-artist-site/index.html'
      - '.github/workflows/convert-readme-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start real example site
        run: |
          cd examples/scam-artist-site
          python -m http.server 4173 > /tmp/open-webgame-preview.log 2>&1 &
          echo $! > /tmp/open-webgame-preview.pid
          sleep 2

      - name: Capture real first screen
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = 'http://127.0.0.1:4173/'
          out = 'assets/scam-artist-real-first-screen.jpg'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 2048, "height": 956}, device_scale_factor=1)
              page.goto(url, wait_until='networkidle', timeout=60000)
              page.screenshot(path=out, type='jpeg', quality=94, full_page=False)
              print('captured:', out, page.viewport_size)
              browser.close()
          PY

      - name: Sync README and clean obsolete preview files
        run: |
          sed -i 's#assets/scam-artist-real-first-screen\.webp#assets/scam-artist-real-first-screen.jpg#g' README.md
          sed -i 's#scam-artist-real-first-screen\.webp#scam-artist-real-first-screen.jpg#g' README.md
          rm -f assets/scam-artist-real-first-screen.webp
          rm -f assets/README_IMAGE_FORMAT_NOTE.txt
          rm -f assets/preview-source-note.md

      - name: Commit real screenshot and README
        run: |
          if git diff --quiet; then
            echo 'Preview and README already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use real GitHub-compatible example screenshot'
          git push
