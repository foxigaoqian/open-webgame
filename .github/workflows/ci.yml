name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm run check:deps

      - name: Syntax check QA scripts
        shell: bash
        run: |
          for file in scripts/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run regression tests
        run: npm test

      - name: Run Open WebGame hard gates against the live example
        run: npm run qa:example
