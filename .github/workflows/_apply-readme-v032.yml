name: Apply v0.3.2 README sync

on:
  push:
    branches:
      - fix/skill-favicon-release-qa
    paths:
      - 'scripts/_patch_readme_v032.py'
      - '.github/workflows/_apply-readme-v032.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/skill-favicon-release-qa
          fetch-depth: 0

      - name: Patch README
        run: python3 scripts/_patch_readme_v032.py

      - name: Commit synced README
        run: |
          rm scripts/_patch_readme_v032.py .github/workflows/_apply-readme-v032.yml
          git config user.name "foxigaoqian"
          git config user.email "taa1@foxmail.com"
          git add README.md scripts/_patch_readme_v032.py .github/workflows/_apply-readme-v032.yml
          git commit -m "docs: sync README with v0.3.2 hardening"
          git push origin HEAD:fix/skill-favicon-release-qa
