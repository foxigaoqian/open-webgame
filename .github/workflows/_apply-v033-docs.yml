name: Apply v0.3.3 docs

on:
  push:
    branches: [feat/v0.3.3-reliability-hardening]
    paths:
      - 'scripts/_migrate_v033_docs.py'
      - '.github/workflows/_apply-v033-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/v0.3.3-reliability-hardening
          fetch-depth: 0

      - name: Apply documentation migration
        run: python3 scripts/_migrate_v033_docs.py

      - name: Commit documentation updates
        shell: bash
        run: |
          git add SKILL.md AGENTS.md README.md CHANGELOG.md references/qa-checklist.md docs/multilingual.md
          if git diff --cached --quiet; then
            echo 'Documentation already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync v0.3.3 reliability contract'
          git push origin HEAD:feat/v0.3.3-reliability-hardening
