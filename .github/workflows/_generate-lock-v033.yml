name: Generate v0.3.3 dependency lock

on:
  push:
    branches: [feat/v0.3.3-reliability-hardening]
    paths:
      - 'package.json'
      - '.github/workflows/_generate-lock-v033.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/v0.3.3-reliability-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Commit lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock v0.3.3 dependencies'
          git push origin HEAD:feat/v0.3.3-reliability-hardening
