name: Migrate v0.2 example metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v02-example.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Scam Artist example
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('examples/scam-artist-site/index.html')
          s = p.read_text()
          canonical = 'https://foxigaoqian.github.io/open-webgame/'

          s = s.replace('<link rel="canonical" href="https://example.com/">', f'<link rel="canonical" href="{canonical}">')
          if 'property="og:url"' not in s:
              s = s.replace(
                  '<meta property="og:description" content="Build a ridiculous pixel-art scam empire in this idle building prototype.">',
                  '<meta property="og:description" content="Build a ridiculous pixel-art scam empire in this idle building prototype.">\n<meta property="og:url" content="https://foxigaoqian.github.io/open-webgame/">'
              )
          if 'name="twitter:card"' not in s:
              s = s.replace(
                  '<meta property="og:image" content="https://img.itch.zone/aW1nLzI4Njg1ODc4LnBuZw%3D%3D/original/l497XE.png">',
                  '<meta property="og:image" content="https://img.itch.zone/aW1nLzI4Njg1ODc4LnBuZw%3D%3D/original/l497XE.png">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Play Scam Artist Online">\n<meta name="twitter:description" content="Play the Scam Artist browser prototype and learn the core loop, controls and beginner progression.">\n<meta name="twitter:image" content="https://img.itch.zone/aW1nLzI4Njg1ODc4LnBuZw%3D%3D/original/l497XE.png">'
              )
          s = s.replace(
              '<h1>BUILD A<br><span class="gold">SHADY EMPIRE.</span></h1>',
              '<h1>PLAY SCAM ARTIST<br><span class="gold">ONLINE.</span></h1>'
          )
          p.write_text(s)
          PY

      - name: Commit migration
        run: |
          if git diff --quiet -- examples/scam-artist-site/index.html; then
            echo 'Example already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/scam-artist-site/index.html
          git commit -m 'seo: migrate Scam Artist example to v0.2 gate'
          git push
