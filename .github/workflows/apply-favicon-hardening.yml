name: Apply favicon hardening

on:
  push:
    branches:
      - fix/favicon-png-qa
    paths:
      - '.github/workflows/apply-favicon-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/favicon-png-qa
          fetch-depth: 0

      - name: Apply favicon hardening
        run: python3 scripts/apply-favicon-hardening.py

      - name: Remove migration files and commit
        shell: bash
        run: |
          rm .github/workflows/apply-favicon-hardening.yml
          rm scripts/apply-favicon-hardening.py
          git config user.name "foxigaoqian"
          git config user.email "taa1@foxmail.com"
          git add -A
          git commit -m "fix: harden favicon delivery and browser QA"
          git push origin HEAD:fix/favicon-png-qa
