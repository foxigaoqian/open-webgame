name: Sync v0.3 docs

on:
  push:
    branches: [feat/v0.3-production-engine]
    paths:
      - '.github/workflows/migrate-v03-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.3-production-engine
          fetch-depth: 0

      - name: Update SKILL README and AGENTS
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path('SKILL.md')
          s = skill.read_text()
          section = '''# v0.3 Production Engine\n\nFor production work, research and QA must be auditable rather than existing only in prose.\n\n## Source provenance\n\nPopulate `sources[]` with the official/first-party research inputs used for the build. Track material factual statements in `claims[]` and connect each claim to one or more `sourceIds`. A deployment-ready build must not rely on tracked claims whose status is `pending` or `rejected`.\n\nUse claims for facts that materially affect the user: controls, platforms, browser/mobile support, release state, developer identity, gameplay systems, progression, compatibility and similar statements. Do not create a claim row for every stylistic sentence.\n\n## Page architecture\n\nPopulate `pages[]` before generating deeper routes. Every page needs a distinct path, output file, intent, canonical and indexability decision. Create a route only when a distinct real user intent has enough useful content. Avoid duplicate intent pages and orphan routes.\n\n## Least-privilege embeds\n\nPopulate `security.allowedIframePermissions`. Start with the minimum required set, normally `autoplay`, `fullscreen`, `gamepad` and only other capabilities the verified runtime actually needs. Do not copy camera, microphone, geolocation, MIDI, XR or sensor permissions merely because a host's default embed snippet includes them.\n\n## Real browser QA\n\nBefore first production launch, run Playwright browser QA after the non-browser gates pass:\n\n```bash\nnpm install\nnpx playwright install chromium\nnpm run qa:browser -- --config path/to/open-webgame.json --site-dir path/to/site\n```\n\nBrowser QA must check the generated shell at approximately 1440px, 768px and 390px, detect horizontal overflow, exercise lazy game loading, confirm the configured runtime is assigned to the iframe, preserve Reload behavior, require a Fullscreen control when offered, and capture real screenshots.\n\nA successful HTTP request is not a substitute for browser QA. A visually correct screenshot is not a substitute for embed verification. Both are required for a first production launch of a play-first build.\n\n## v0.3 machine gates\n\n```bash\nnpm run check:config -- --config path/to/open-webgame.json\nnpm run check:content -- --config path/to/open-webgame.json\nnpm run check:site -- --config path/to/open-webgame.json --site-dir path/to/site\nnpm run check:seo -- --config path/to/open-webgame.json --html path/to/index.html\nnpm run check:security -- --config path/to/open-webgame.json --html path/to/index.html\nnpm run verify:embed -- --config path/to/open-webgame.json\nnpm run qa -- --config path/to/open-webgame.json --html path/to/index.html\n```\n\nSee [`docs/project-config.md`](./docs/project-config.md).\n\n'''
          if '# v0.3 Production Engine' not in s:
              s = s.replace('# Inputs\n', section + '# Inputs\n')
          skill.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          v03 = '''## v0.3 — Production Engine\n\nOpen WebGame v0.3 moves another set of production rules out of prompt prose and into machine-checkable project state.\n\nNew production contracts:\n\n- `sources[]` + `claims[]` — connect important factual content to recorded sources\n- `pages[]` — define distinct routes, intents, files, canonicals and indexability\n- `security` — declare the iframe capabilities the site is allowed to request\n- Playwright Browser QA — boot the real generated page at desktop/tablet/mobile widths and save real screenshots\n\nNew gates:\n\n```bash\nnpm run check:content -- --config path/to/open-webgame.json\nnpm run check:site -- --config path/to/open-webgame.json --site-dir path/to/site\nnpm run check:security -- --config path/to/open-webgame.json --html path/to/index.html\nnpm run qa:browser -- --config path/to/open-webgame.json --site-dir path/to/site\n```\n\nThe aggregate non-browser QA now checks config, provenance, page architecture, On-Page SEO, security and embed state. First production launch additionally requires the Playwright browser run.\n\nSee [`docs/project-config.md`](./docs/project-config.md) and [`CHANGELOG.md`](./CHANGELOG.md).\n\n'''
          if '## v0.3 — Production Engine' not in r:
              r = r.replace('## v0.2 — Zero-Config + Machine-Enforced QA\n', v03 + '## v0.2 — Zero-Config + Machine-Enforced QA\n')
          readme.write_text(r)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          prod = '''## v0.3 production requirements\n\nIn addition to the existing game/content/design/SEO gates:\n\n- record official research inputs in `sources[]`\n- connect material factual statements to source-backed `claims[]`\n- reject deployment-ready status when a tracked claim is pending or rejected\n- define intentional routes in `pages[]` before adding multi-page output\n- keep indexable page intents distinct and avoid orphan pages\n- enforce least-privilege iframe capabilities from `security.allowedIframePermissions`\n- run `check:content`, `check:site` and `check:security` as hard gates\n- run Playwright browser QA before first production launch\n- preserve real desktop/tablet/mobile screenshots as QA evidence when CI is available\n\nDo not change `status.deploymentReady` merely to silence a failing gate. Fix the underlying source, page, security, SEO or embed issue.\n\n'''
          if '## v0.3 production requirements' not in a:
              a = a.replace('## Working order\n', prod + '## Working order\n')
          agents.write_text(a)
          PY

      - name: Commit documentation update
        run: |
          if git diff --quiet -- SKILL.md README.md AGENTS.md; then
            echo 'v0.3 docs already synced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md README.md AGENTS.md
          git commit -m 'docs: document v0.3 production engine'
          git push origin HEAD:feat/v0.3-production-engine
